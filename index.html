<!DOCTYPE html>  
<html lang="es">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Estadísticas - Unicornio Negro</title>  
    <style>  
        * {margin:0; padding:0; box-sizing:border-box; font-family:sans-serif;}  
        body {background:linear-gradient(135deg,#1a1a2e,#16213e); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:40px 20px; color:white;}  
        h1 {font-size:28px; margin-bottom:10px; color:#d4af37; text-align:center;}  
        .subtitulo {color:#aaa; margin-bottom:40px; text-align:center;}
        .caja {background:rgba(255,255,255,0.05); padding:30px; border-radius:15px; width:100%; max-width:500px; box-shadow:0 4px 20px rgba(0,0,0,0.3); margin-bottom:20px;}
        .dato {font-size:24px; margin:15px 0; padding:15px; background:rgba(212,175,55,0.1); border-radius:10px; border-left:3px solid #d4af37;}
        .etiqueta {font-size:14px; color:#aaa; margin-bottom:5px;}
        .valor {font-size:32px; font-weight:bold; color:#d4af37;}
        .boton {background:#d4af37; color:#000; font-size:16px; font-weight:bold; padding:12px 25px; border:none; border-radius:8px; cursor:pointer; margin-top:10px; width:100%;}
        .boton:hover {background:#f0c94e;}
        .aviso {margin-top:30px; font-size:13px; color:#666; text-align:center;}
        .historial {margin-top:20px; max-height:300px; overflow-y:auto;}
        .item-historial {padding:10px; border-bottom:1px solid #333; font-size:14px;}
        .fecha-historial {color:#888; font-size:12px;}
    </style>  
</head>  
<body>  

    <h1>📊 ESTADÍSTICAS DE VISITAS</h1>  
    <p class="subtitulo">Solo TÚ puedes ver esta página — es privada 🤫</p>

    <div class="caja">
        <div class="dato">
            <div class="etiqueta">👀 Visitas de hoy</div>
            <div class="valor" id="visitasHoy">0</div>
        </div>

        <div class="dato">
            <div class="etiqueta">📈 Total visitas acumuladas</div>
            <div class="valor" id="totalVisitas">0</div>
        </div>

        <div class="dato">
            <div class="etiqueta">📅 Fecha de hoy</div>
            <div class="valor" id="fechaHoy" style="font-size:20px;">-</div>
        </div>

        <button class="boton" onclick="reiniciarContadores()">🔄 Reiniciar contadores</button>
        <button class="boton" onclick="borrarHistorial()" style="background:#444; color:white; margin-top:10px;">🗑️ Borrar historial</button>
    </div>

    <div class="caja">
        <h3 style="color:#d4af37; margin-bottom:15px;">📋 Historial por días</h3>
        <div class="historial" id="historial"></div>
    </div>

    <p class="aviso">🔒 Tus datos se guardan aquí automáticamente. Nadie más ve esta página.</p>

    <script>  
        // 📅 FECHA DE HOY
        const hoy = new Date().toLocaleDateString('es-ES');
        document.getElementById('fechaHoy').textContent = hoy;

        // 📊 CARGAR DATOS GUARDADOS
        let datos = JSON.parse(localStorage.getItem('estadisticasUnicornio') || '{}');
        
        // Si es un día nuevo, lo registramos
        if (!datos[hoy]) {
            datos[hoy] = 0;
        }

        // Total acumulado
        const total = Object.values(datos).reduce((a,b) => a + b, 0);

        // Mostrar en pantalla
        document.getElementById('visitasHoy').textContent = datos[hoy];
        document.getElementById('totalVisitas').textContent = total;

        // Mostrar historial
        const historialDiv = document.getElementById('historial');
        historialDiv.innerHTML = '';
        Object.keys(datos).sort().reverse().forEach(fecha => {
            historialDiv.innerHTML += `
                <div class="item-historial">
                    <span class="fecha-historial">${fecha}</span> → 
                    <strong>${datos[fecha]}</strong> visitas
                </div>
            `;
        });

        // 🔄 REINICIAR CONTADORES
        function reiniciarContadores() {
            if (confirm('¿Seguro que quieres reiniciar el contador de hoy?')) {
                datos[hoy] = 0;
                localStorage.setItem('estadisticasUnicornio', JSON.stringify(datos));
                location.reload();
            }
        }

        // 🗑️ BORRAR TODO EL HISTORIAL
        function borrarHistorial() {
            if (confirm('⚠️ ¿Seguro? Se borrarán TODOS los datos y no se podrán recuperar.')) {
                localStorage.removeItem('estadisticasUnicornio');
                location.reload();
            }
        }
    </script>  

</body>  
</html>
